name: Deploy web app to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      EXPO_PUBLIC_BASE_URL: /DailyBudgetApp
      EXPO_PUBLIC_FIREBASE_API_KEY: AIzaSyAeqnubsEuMQj-Xb_vup-EspmcPHQloTzU
      EXPO_PUBLIC_FIREBASE_AUTH_DOMAIN: dailybudget-35c26.firebaseapp.com
      EXPO_PUBLIC_FIREBASE_PROJECT_ID: dailybudget-35c26
      EXPO_PUBLIC_FIREBASE_STORAGE_BUCKET: dailybudget-35c26.firebasestorage.app
      EXPO_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: "420817333542"
      EXPO_PUBLIC_FIREBASE_APP_ID: "1:420817333542:android:376a7baca1ebbbb58625e7"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build web app
        run: npx expo export --platform web

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload web build
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Publish GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
