name: Verify shared family receipts
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  receipts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            functions/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm ci --prefix functions --engine-strict
      - run: npx tsc --noEmit
      - run: npm run test:finance
      - run: node --test tests/cloud-readiness-audit.test.mjs
      - run: npm --prefix functions test
      - name: Verify existing budget rules and receipt lifecycle in isolated emulators
        run: npx --yes firebase-tools@15.36.0 emulators:exec --project demo-dailybudget-receipts --only auth,firestore,storage "node --test tests/firestore.rules.test.mjs && npm --prefix functions run test:integration"
      - name: Install browser for account-deletion checks
        run: npx playwright install --with-deps chromium
      - name: Verify account deletion, identity protection and receipt/sign-in regressions
        run: npm run test:accounts:browser
      - name: Preserve emulator-only browser failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-failure-${{ github.run_attempt }}
          path: test-results/
          if-no-files-found: ignore
          retention-days: 3
